<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Нажми Шах</title>
    <style>
        /* Сброс стилей */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Общие стили для "страниц" */
        .page {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: none; /* Скрыто по умолчанию */
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Класс для активной страницы */
        .page.active {
            display: flex;
            animation: fadeIn 0.5s ease-in-out;
        }

        /* Анимация появления */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* --- СТРАНИЦА 1: КНОПКА --- */
        #page1 {
            background: linear-gradient(135deg, #1e130c, #9a8478);
        }

        .btn-shah {
            padding: 20px 50px;
            font-size: 32px;
            font-weight: bold;
            color: #ffffff;
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            border: none;
            border-radius: 15px;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .btn-shah:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 15px 25px rgba(255, 75, 43, 0.4);
        }

        .btn-shah:active {
            transform: translateY(2px) scale(0.98);
        }

        /* --- СТРАНИЦА 2: КАРТИНКА --- */
        #page2 {
            background-color: #000;
        }

        .fullscreen-img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Картинка заполняет весь экран без искажений */
        }

        /* Кнопка "Назад" */
        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 10px 20px;
            font-size: 18px;
            color: #fff;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            cursor: pointer;
            backdrop-filter: blur(5px);
            transition: background 0.3s;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>

    <!-- СТРАНИЦА 1 -->
    <div id="page1" class="page active">
        <button onclick="showPage('page2')" class="btn-shah">нажми Шах</button>
    </div>

    <!-- СТРАНИЦА 2 -->
    <div id="page2" class="page">
        <!-- ВАЖНО: Замени ссылку ниже на свой файл (например, просто "gorilla.jpg"), если картинка лежит в той же папке -->
        <img src="https://i.imgur.com/5V3Yl0z.jpg" alt="Шах" class="fullscreen-img">
        <button onclick="showPage('page1')" class="back-btn">← Назад</button>
    </div>

    <!-- СКРИПТ ДЛЯ ПЕРЕКЛЮЧЕНИЯ -->
    <script>
        function showPage(pageId) {
            // Скрываем все страницы
            document.querySelectorAll('.page').forEach(page => {
                page.classList.remove('active');
            });
            // Показываем нужную
            document.getElementById(pageId).classList.add('active');
        }
    </script>

</body>
</html>
